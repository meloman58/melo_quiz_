<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メロ男診断 & クイズメーカー</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #fbcfe8 100%);
      min-height: 100vh;
    }
    
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.7) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) scale(1.2) rotate(20deg);
        opacity: 0;
      }
    }

    .floating-heart {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.2s ease-out forwards;
      z-index: 50;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.95) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-pop {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: #f472b6;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex items-center justify-center p-2 sm:p-4 min-h-screen text-slate-800">

  <!-- メインコンテナ -->
  <div id="app" class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden border border-white/60 flex flex-col h-[750px] relative">
    
    <!-- PIN入力モーダル -->
    <div id="pin-modal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-pop">
      <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl border border-pink-100 text-center space-y-4 relative">
        <button onclick="closePinModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        
        <div class="w-12 h-12 bg-pink-100 text-pink-600 rounded-2xl flex items-center justify-center mx-auto text-xl shadow-inner">
          <i class="fa-solid fa-lock"></i>
        </div>
        
        <div>
          <h3 class="font-black text-slate-800 text-base">編集者認証</h3>
          <p class="text-xs text-slate-400 mt-1">8桁の暗証番号を入力してください</p>
        </div>

        <input type="password" id="pin-input" maxlength="8" placeholder="••••••••" pattern="[0-9]*" inputmode="numeric" class="w-full text-center text-xl font-black tracking-[0.3em] py-2.5 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 text-pink-600 bg-pink-50/50">

        <div class="flex gap-2 pt-1">
          <button onclick="closePinModal()" class="w-1/2 py-2.5 bg-gray-100 text-gray-600 font-bold rounded-xl text-xs hover:bg-gray-200 transition-all">
            キャンセル
          </button>
          <button onclick="verifyPin()" class="w-1/2 py-2.5 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold rounded-xl text-xs shadow-md hover:opacity-95 active:scale-95 transition-all">
            解除
          </button>
        </div>
      </div>
    </div>

    <!-- 上部ナビゲーション -->
    <div class="bg-white/80 border-b border-pink-100 px-4 py-2 flex justify-between items-center z-30 shrink-0">
      <div class="flex items-center gap-1.5 font-black text-pink-600 text-sm">
        <i class="fa-solid fa-heart-pulse"></i>
        <span>メロ男診断</span>
      </div>
      <div class="flex gap-1 bg-pink-50 p-1 rounded-xl text-xs font-bold">
        <button id="tab-play" onclick="switchMode('play')" class="px-3 py-1.5 rounded-lg bg-pink-500 text-white shadow-sm transition-all">
          <i class="fa-solid fa-gamepad mr-1"></i>プレイ
        </button>
        <button id="tab-edit" onclick="switchMode('edit')" class="px-3 py-1.5 rounded-lg text-gray-500 hover:text-pink-600 transition-all">
          <i class="fa-solid fa-pen-to-square mr-1"></i>クイズ編集
        </button>
      </div>
    </div>

    <!-- 1. プレイモード -->
    <div id="mode-play" class="flex-1 flex flex-col overflow-hidden relative">
      <!-- スタート画面 -->
      <div id="start-screen" class="flex-1 flex flex-col justify-between p-6 text-center z-10 overflow-y-auto">
        <div class="my-auto space-y-5 py-2">
          <div class="relative inline-block">
            <span class="inline-block bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full mb-2 animate-bounce">
              💖 女子をキュンとさせろ！
            </span>
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 tracking-tight">
              メロ男診断
            </h1>
            <p class="text-xs text-pink-400 font-bold mt-1">〜返答1つでメロポイントが上昇〜</p>
          </div>

          <div class="relative w-24 h-24 mx-auto">
            <div class="absolute inset-0 bg-pink-300 rounded-full blur-xl opacity-50 animate-pulse"></div>
            <div class="relative w-full h-full rounded-full bg-gradient-to-tr from-pink-400 to-purple-400 flex items-center justify-center shadow-lg border-4 border-white text-4xl">
              🕺✨
            </div>
          </div>

          <div class="space-y-2 px-2 text-left">
            <label class="block text-xs font-bold text-gray-500 ml-1">診断を受ける人の名前</label>
            <input type="text" id="user-name-input" placeholder="名前またはニックネームを入力" maxlength="10" class="w-full text-center text-sm font-bold py-3 px-4 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 bg-white text-gray-700 shadow-sm">
          </div>
        </div>

        <div class="space-y-2 shrink-0 pt-2">
          <button onclick="startQuiz()" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold rounded-2xl shadow-lg shadow-pink-500/30 transform active:scale-95 transition-all text-base flex items-center justify-center gap-2">
            <span>診断スタート</span>
            <i class="fa-solid fa-circle-play"></i>
          </button>
        </div>
      </div>

      <!-- クイズ画面 -->
      <div id="quiz-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <div class="bg-white/90 border-b border-pink-100 p-3 shadow-sm z-20 shrink-0">
          <div class="flex justify-between items-center mb-1.5">
            <span id="question-progress" class="text-[11px] font-bold text-pink-600 bg-pink-50 px-2.5 py-0.5 rounded-full">
              Q 1/15
            </span>
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-fire text-pink-500 text-xs"></i>
              <span class="text-xs text-gray-400 font-bold">現在の獲得:</span>
              <span id="current-score-text" class="text-base font-black text-pink-600">0pt / 355pt</span>
            </div>
          </div>
          <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden border border-pink-100">
            <div id="score-bar" class="bg-gradient-to-r from-pink-400 to-purple-500 h-full transition-all duration-500 w-0"></div>
          </div>
        </div>

        <div id="chat-area" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50">
          <div class="flex gap-2.5 items-start animate-pop">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-pink-400 to-rose-300 shrink-0 flex items-center justify-center text-white font-bold shadow-sm text-base border-2 border-white">
              👩🏻
            </div>
            <div class="flex flex-col items-start max-w-[80%]">
              <span class="text-[10px] text-gray-400 mb-0.5 ml-1 font-bold">彼女</span>
              <div id="girl-message" class="bg-white border border-pink-100 text-gray-800 text-xs sm:text-sm font-medium p-3 rounded-2xl rounded-tl-none shadow-sm leading-relaxed"></div>
            </div>
          </div>

          <div id="user-reply-container" class="hidden flex gap-2.5 items-start justify-end animate-pop">
            <div class="flex flex-col items-end max-w-[85%]">
              <span id="player-display-name" class="text-[10px] text-gray-400 mb-0.5 mr-1 font-bold">あなた</span>
              <div id="user-reply-text" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white text-xs sm:text-sm font-medium p-3 rounded-2xl rounded-tr-none shadow-sm leading-relaxed"></div>
              <div id="reply-feedback" class="text-[11px] font-bold mt-1 px-2 py-0.5 rounded-full"></div>
            </div>
          </div>
        </div>

        <div id="options-container" class="p-3 bg-white border-t border-pink-100 space-y-2 shrink-0">
          <p class="text-[11px] text-gray-400 font-bold mb-1 flex items-center gap-1">
            <i class="fa-regular fa-comment"></i> 返事を選択してください：
          </p>
          <div id="options-list" class="space-y-1.5 max-h-[180px] overflow-y-auto"></div>
        </div>

        <div id="next-button-container" class="hidden p-3 bg-white border-t border-pink-100 shrink-0">
          <button id="next-btn" onclick="nextQuestion()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-sm rounded-xl shadow-md hover:opacity-95 active:scale-98 transition-all flex items-center justify-center gap-2">
            <span>次のメッセージを読む</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- 結果画面 ＆ 全ユーザー順位無制限ランキング -->
      <div id="result-screen" class="hidden flex-1 flex flex-col justify-between p-4 text-center z-10 overflow-y-auto space-y-3">
        <div class="space-y-3 my-auto">
          <span class="inline-block bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full">
            ✨ 診断結果 ✨
          </span>

          <p id="result-player-name" class="text-sm font-black text-gray-700"></p>

          <div>
            <p class="text-[11px] font-bold text-gray-400">最終獲得スコア</p>
            <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 my-0.5">
              <span id="final-score">0</span> <span class="text-lg font-bold text-pink-500">/ 355pt</span>
            </div>
          </div>

          <div class="bg-gradient-to-r from-pink-500 to-purple-600 p-0.5 rounded-2xl shadow-md">
            <div class="bg-white rounded-[14px] p-3">
              <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">獲得称号</span>
              <h2 id="result-title" class="text-base font-black text-pink-600 mt-0.5"></h2>
            </div>
          </div>

          <div class="bg-white/80 border border-pink-100 rounded-xl p-3 text-left shadow-sm">
            <p id="result-description" class="text-xs text-gray-600 leading-relaxed"></p>
          </div>

          <!-- 全ユーザー共有無制限ランキング表示エリア -->
          <div class="bg-white border border-pink-100 rounded-2xl p-3 shadow-sm text-left space-y-2">
            <div class="flex items-center justify-between border-b border-pink-100 pb-1.5">
              <span class="text-xs font-black text-pink-600 flex items-center gap-1">
                <i class="fa-solid fa-trophy text-yellow-500"></i> 全国ランキング (全プレイヤー順位)
              </span>
              <span class="text-[10px] text-gray-400 font-bold" id="total-players-count">全0名</span>
            </div>
            <!-- スクロール可能な無制限ランキング一覧 -->
            <div id="ranking-list" class="space-y-1.5 max-h-44 overflow-y-auto text-xs pr-1">
              <!-- 全ユーザーの順位が動的ロード -->
            </div>
          </div>
        </div>

        <div class="space-y-2 shrink-0 border-t border-pink-100 pt-2">
          <button onclick="shareResult()" class="w-full py-2.5 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold rounded-xl shadow-md text-xs flex items-center justify-center gap-2 transform active:scale-95 transition-all">
            <i class="fa-solid fa-share-nodes"></i>
            <span>結果をコピーしてシェア</span>
          </button>
          <button onclick="resetQuiz()" class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl transition-all text-xs flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-rotate-left"></i>
            <span>もう一度診断する</span>
          </button>
        </div>
      </div>

    </div>

    <!-- 2. 編集モード -->
    <div id="mode-edit" class="hidden flex-1 flex flex-col overflow-hidden bg-slate-50">
      <div id="owner-banner" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-2.5 px-4 text-xs flex justify-between items-center shadow-md">
        <div class="flex items-center gap-1.5 font-bold">
          <i class="fa-solid fa-shield-halved text-yellow-300"></i>
          <span>クイズ編集モード</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="lockEditMode()" class="bg-white/20 hover:bg-white/30 text-white font-bold px-2.5 py-1 rounded-lg text-xs transition-all flex items-center gap-1">
            <i class="fa-solid fa-lock"></i> 施錠
          </button>
          <button id="save-btn" onclick="saveQuizDataToCloud()" class="bg-white text-pink-600 hover:bg-pink-50 font-bold px-3 py-1 rounded-lg text-xs shadow transition-all flex items-center gap-1">
            <i class="fa-solid fa-floppy-disk"></i> 保存する
          </button>
        </div>
      </div>

      <div class="p-3 bg-white border-b border-pink-100 flex justify-between items-center shrink-0">
        <span class="text-xs font-bold text-gray-700">登録済み質問 (<span id="edit-count">0</span>件)</span>
        <button id="add-q-btn" onclick="addNewQuestionPrompt()" class="px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-white text-xs font-bold rounded-lg shadow-sm transition-all flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> 新規質問を追加
        </button>
      </div>

      <div id="edit-list" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 全15問の初期データ
    const defaultQuizData = [
      { situation: "今日ありがとう！ 楽しかった また遊びたい", options: [{ text: "ありがとう 俺もまた遊びたい", score: 20 }, { text: "ありがとー 俺も楽しかった！", score: 5 }, { text: "ありがとう 次いつ空いてる？", score: 25 }, { text: "明日学校遅れないようにね笑 おやすみ", score: 0 }] },
      { situation: "おやすみー 明日楽しみにしてる♪", options: [{ text: "楽しみで寝れないかも笑", score: 5 }, { text: "俺も おやすみ", score: 20 }, { text: "おやすみ また明日", score: 25 }, { text: "いい夢みてね おやすみ", score: 0 }] },
      { situation: "元カノとかいるの？", options: [{ text: "いないよ笑", score: 3 }, { text: "1人いるよ", score: 25 }, { text: "まじでモテない笑", score: 0 }, { text: "1人いるけどなんも覚えてない笑", score: 0 }] },
      { situation: "髪切ったんだけど気づいた？", options: [{ text: "気づいてたよ笑 似合ってる", score: 15 }, { text: "まじで良かった みんな可愛いって言ってた", score: 0 }, { text: "ちらっと見た 明日ちゃんと見る", score: 25 }, { text: "破壊力エグかったよ 可愛いね", score: 0 }] },
      { situation: "趣味とかある？いつも何してるの", options: [{ text: "特にないんだよね笑 アニメとか？", score: 10 }, { text: "ずっとスマホ見てる笑", score: 3 }, { text: "しょうもないことばっかしてる気がする", score: 25 }, { text: "服見るのとか好きなんだよね", score: 0 }] },
      { situation: "タイプとかある？", options: [{ text: "好きになった人がタイプだよ", score: 5 }, { text: "黒髪ボブかなー", score: 0 }, { text: "話してて楽しい人", score: 15 }, { text: "よく笑う人が好き", score: 20 }] },
      { situation: "アイドル好きなんだ！誰推し？", options: [{ text: "まなふぃ", score: 20 }, { text: "野口衣織", score: 15 }, { text: "tenちゃん", score: 5 }, { text: "ウィンター", score: 0 }] },
      { situation: "アニメとか見るんだ！オススメは？", options: [{ text: "BLEACHかな", score: 25 }, { text: "無職転生 面白いよ", score: 0 }, { text: "ジョジョかな みんなかっこいい", score: 10 }, { text: "ブルーロック", score: 0 }] },
      { situation: "デートの服装は？", options: [{ text: "ロングコートとタートルネックで大人っぽく", score: 10 }, { text: "パーカーとカーゴパンツでストリート系に", score: 2 }, { text: "シャツとカーディガンでインテリ系に", score: 0 }, { text: "シャツとセーターを重ね着して意識高めに", score: 20 }] },
      { situation: "野球好きなんだ！好きな球団は？", options: [{ text: "阪神かな 親が好きで昔から", score: 25 }, { text: "ベイスターズ！ よく現地も行くよ", score: 15 }, { text: "ソフトバンク 最近優勝したよ", score: 5 }, { text: "日本ハムかな 新庄いるとこわかる？", score: 0 }] },
      { situation: "テストの点数何点だった？（100点満点）", options: [{ text: "勝負しよ笑 俺16点", score: 0 }, { text: "やばすぎて言えない笑（30点）", score: 0 }, { text: "平均くらい", score: 10 }, { text: "思ったより良かったかも（90点）", score: 25 }] },
      { situation: "今日の服、どう？", options: [{ text: "可愛い", score: 25 }, { text: "似合ってる", score: 15 }, { text: "俺の好きな感じだ", score: 0 }, { text: "まじで良い", score: 0 }] },
      { situation: "バンドはじめたらなんの楽器がいい？", options: [{ text: "ギターボーカル", score: 0 }, { text: "ベース", score: 20 }, { text: "ドラム", score: 15 }, { text: "キーボード", score: 0 }] },
      { situation: "彼女の誕生日プレゼントにあげるものは？", options: [{ text: "リファのコーム", score: 0 }, { text: "アイシャドウパレット", score: 0 }, { text: "お揃いのマフラー", score: 15 }, { text: "ちょっと高めのピアス", score: 25 }] },
      { situation: "どこの塾行ってるの？", options: [{ text: "臨海セミナー", score: 0 }, { text: "河合塾", score: 15 }, { text: "東進", score: 5 }, { text: "駿台", score: 25 }] }
    ];

    window.quizData = JSON.parse(JSON.stringify(defaultQuizData));

    let currentQuestionIndex = 0;
    let totalScore = 0;
    let playerName = "あなた";
    let isUnlocked = false;
    const PIN_CODE = "01170715";
    const MAX_POINT = 355;

    // Firebase 初期化
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'melo-quiz-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "demo", authDomain: "demo", projectId: "demo" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let globalRankingData = [];

    // 認証
    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        listenToGlobalRanking();
      } catch (e) {
        console.log("Auth fallback to local storage ranking", e);
        loadLocalRanking();
      }
    }

    // クラウドから全ユーザーランキングをリアルタイム取得（順位無制限）
    function listenToGlobalRanking() {
      try {
        const rankingRef = collection(db, 'artifacts', appId, 'public', 'data', 'global_rankings');
        onSnapshot(rankingRef, (snapshot) => {
          const map = new Map();
          snapshot.forEach((doc) => {
            const data = doc.data();
            if (data && data.name) {
              // 同一ユーザー名がある場合は高いスコアを優先
              const existing = map.get(data.name);
              if (!existing || data.score > existing.score) {
                map.set(data.name, data);
              }
            }
          });
          globalRankingData = Array.from(map.values());
          // メモリ上でスコア順にソート（同点は新しい順）
          globalRankingData.sort((a, b) => (b.score - a.score) || ((b.timestamp || 0) - (a.timestamp || 0)));
          displayRanking();
        }, (error) => {
          console.log("Firestore error, switching to local backup", error);
          loadLocalRanking();
        });
      } catch(e) {
        loadLocalRanking();
      }
    }

    // クラウドへ結果をリアルタイム送信
    async function saveGlobalScore(name, score, rank) {
      const newRecord = { 
        name: name, 
        score: score, 
        rank: rank, 
        date: new Date().toLocaleDateString(), 
        timestamp: Date.now() 
      };
      
      // ローカル保存（バックアップ）
      let localRank = JSON.parse(localStorage.getItem('melo_quiz_shared_ranking') || '[]');
      localRank.push(newRecord);
      localRank.sort((a, b) => b.score - a.score);
      localStorage.setItem('melo_quiz_shared_ranking', JSON.stringify(localRank));

      // クラウド（オンライン共有）保存
      try {
        if (!auth.currentUser) {
          await signInAnonymously(auth);
        }
        const rankingRef = collection(db, 'artifacts', appId, 'public', 'data', 'global_rankings');
        await addDoc(rankingRef, newRecord);
      } catch(e) {
        console.log("Failed to push global score online", e);
      }
    }

    function loadLocalRanking() {
      globalRankingData = JSON.parse(localStorage.getItem('melo_quiz_shared_ranking') || '[]');
      globalRankingData.sort((a, b) => b.score - a.score);
      displayRanking();
    }

    window.switchMode = function(mode) {
      const playMode = document.getElementById('mode-play');
      const editMode = document.getElementById('mode-edit');
      const tabPlay = document.getElementById('tab-play');
      const tabEdit = document.getElementById('tab-edit');

      if (mode === 'play') {
        playMode.classList.remove('hidden');
        editMode.classList.add('hidden');
        tabPlay.className = "px-3 py-1.5 rounded-lg bg-pink-500 text-white shadow-sm transition-all";
        tabEdit.className = "px-3 py-1.5 rounded-lg text-gray-500 hover:text-pink-600 transition-all";
        resetQuiz();
      } else {
        if (!isUnlocked) {
          openPinModal();
          return;
        }
        playMode.classList.add('hidden');
        editMode.classList.remove('hidden');
        tabEdit.className = "px-3 py-1.5 rounded-lg bg-pink-500 text-white shadow-sm transition-all";
        tabPlay.className = "px-3 py-1.5 rounded-lg text-gray-500 hover:text-pink-600 transition-all";
        renderEditList();
      }
    }

    function openPinModal() {
      const modal = document.getElementById('pin-modal');
      const pinInput = document.getElementById('pin-input');
      pinInput.value = '';
      modal.classList.remove('hidden');
      setTimeout(() => pinInput.focus(), 100);

      pinInput.onkeyup = function(e) {
        if (e.key === 'Enter') verifyPin();
      };
    }

    window.closePinModal = function() {
      document.getElementById('pin-modal').classList.add('hidden');
    }

    window.verifyPin = function() {
      const pinInput = document.getElementById('pin-input');
      if (pinInput.value === PIN_CODE) {
        isUnlocked = true;
        closePinModal();
        showToast("ロックを解除しました 🔓");
        switchMode('edit');
      } else {
        showToast("暗証番号が正しくありません ❌");
        pinInput.value = '';
        pinInput.focus();
      }
    }

    window.lockEditMode = function() {
      isUnlocked = false;
      showToast("編集モードをロックしました 🔒");
      switchMode('play');
    }

    window.startQuiz = function() {
      const nameInput = document.getElementById('user-name-input').value.trim();
      playerName = nameInput ? nameInput : "匿名プレイヤー";
      document.getElementById('player-display-name').innerText = playerName;

      if (!window.quizData || window.quizData.length === 0) {
        showToast("質問が登録されていません。「クイズ編集」から追加してください！");
        return;
      }
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      currentQuestionIndex = 0;
      totalScore = 0;
      loadQuestion();
    }

    function loadQuestion() {
      const q = window.quizData[currentQuestionIndex];
      
      document.getElementById('question-progress').innerText = "Q " + (currentQuestionIndex + 1) + "/" + window.quizData.length;
      document.getElementById('girl-message').innerText = q.situation;
      
      document.getElementById('user-reply-container').classList.add('hidden');
      document.getElementById('next-button-container').classList.add('hidden');
      document.getElementById('options-container').classList.remove('hidden');

      const optionsList = document.getElementById('options-list');
      optionsList.innerHTML = '';

      q.options.forEach(function(opt) {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-2.5 bg-gray-50 hover:bg-pink-50 border border-gray-200 hover:border-pink-300 rounded-xl text-xs sm:text-sm text-gray-700 font-medium transition-all transform active:scale-98 flex items-center justify-between group";
        btn.innerHTML = '<span>' + opt.text + '</span><i class="fa-solid fa-chevron-right text-[10px] text-gray-300 group-hover:text-pink-400"></i>';
        btn.onclick = function() { selectOption(opt); };
        optionsList.appendChild(btn);
      });
    }

    function selectOption(option) {
      totalScore += option.score;

      const currentPercent = Math.min(100, Math.round((totalScore / MAX_POINT) * 100));
      document.getElementById('score-bar').style.width = currentPercent + '%';
      document.getElementById('current-score-text').innerText = totalScore + 'pt / ' + MAX_POINT + 'pt';

      document.getElementById('options-container').classList.add('hidden');
      
      const replyContainer = document.getElementById('user-reply-container');
      const replyText = document.getElementById('user-reply-text');
      const feedbackText = document.getElementById('reply-feedback');

      replyText.innerText = option.text;
      
      if (option.score >= 20) {
        feedbackText.className = "text-[11px] font-bold mt-1 px-2 py-0.5 rounded-full bg-pink-100 text-pink-600";
        feedbackText.innerText = "[メロ度 +" + option.score + "pt] 最高の一言！女子はメロメロ✨";
        createHearts();
      } else if (option.score > 0) {
        feedbackText.className = "text-[11px] font-bold mt-1 px-2 py-0.5 rounded-full bg-purple-100 text-purple-600";
        feedbackText.innerText = "[メロ度 +" + option.score + "pt] 悪くない返事！好感度アップ";
      } else {
        feedbackText.className = "text-[11px] font-bold mt-1 px-2 py-0.5 rounded-full bg-gray-100 text-gray-500";
        feedbackText.innerText = "[メロ度 +0pt] メロ要素なし！不器用な返事";
      }

      replyContainer.classList.remove('hidden');
      document.getElementById('next-button-container').classList.remove('hidden');
    }

    function createHearts() {
      const container = document.getElementById('quiz-screen');
      for (let i = 0; i < 5; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart text-pink-500 text-lg';
        heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
        heart.style.left = (Math.random() * 80 + 10) + '%';
        heart.style.bottom = '90px';
        heart.style.animationDelay = (Math.random() * 0.2) + 's';
        container.appendChild(heart);
        setTimeout(function() { heart.remove(); }, 1300);
      }
    }

    window.nextQuestion = function() {
      currentQuestionIndex++;
      if (currentQuestionIndex < window.quizData.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('result-player-name').innerText = "👤 " + playerName + " さんの結果";
      const scoreElem = document.getElementById('final-score');
      const titleElem = document.getElementById('result-title');
      const descElem = document.getElementById('result-description');

      let currentDisplayScore = 0;
      const timer = setInterval(function() {
        if (currentDisplayScore >= totalScore) {
          scoreElem.innerText = totalScore;
          clearInterval(timer);
        } else {
          currentDisplayScore++;
          scoreElem.innerText = currentDisplayScore;
        }
      }, 8);

      let rankTitle = "";
      if (totalScore >= 330) {
        rankTitle = "👑 国宝級・全人類メロメロ男 (SSS)";
        descElem.innerText = "すべての返答が神レベル！女子を即メロメロにする最強の男。息をしてるだけで全員沼ります。";
      } else if (totalScore >= 280) {
        rankTitle = "💎 沼らせ確定・限界メロ男 (S)";
        descElem.innerText = "狙ってないのに女子を沼らせちゃう罪なメロ男！一言一言の破壊力がズバ抜けています。";
      } else if (totalScore >= 230) {
        rankTitle = "✨ モテの極み・隠れメロ男 (A)";
        descElem.innerText = "さりげない優しさとセンス抜群の返しができるイケメン！ふとしたギャップに女子は胸キュン。";
      } else if (totalScore >= 170) {
        rankTitle = "🌸 愛され系・ピュアな普通男 (B)";
        descElem.innerText = "誠実で安心感があるタイプ。もう少し「特別感」をプラスすると一気にメロ度が爆上がりします！";
      } else if (totalScore >= 110) {
        rankTitle = "😅 惜しい！ツンデレストイック男 (C)";
        descElem.innerText = "悪気はないけどちょっと不器用。素直になれないところが逆にギャップ…かも？";
      } else if (totalScore >= 50) {
        rankTitle = "🗿 鉄壁・男友情優先マン (D)";
        descElem.innerText = "友達としては最高だけど、メロ度は低め！男ノリを封印して女子目線を意識してみよう。";
      } else {
        rankTitle = "🧊 絶対零度・塩対応男 (F)";
        descElem.innerText = "逆にすがすがしいほどの超・塩対応！女子のあざとさをすべて撃ち落とす鉄壁の男です。";
      }

      titleElem.innerText = rankTitle;

      saveGlobalScore(playerName, totalScore, rankTitle);
    }

    function displayRanking() {
      const listElem = document.getElementById('ranking-list');
      const countElem = document.getElementById('total-players-count');
      if (!listElem) return;

      listElem.innerHTML = '';
      countElem.innerText = "全" + globalRankingData.length + "名";

      if (globalRankingData.length === 0) {
        listElem.innerHTML = '<p class="text-gray-400 text-center py-2">まだプレイデータがありません</p>';
        return;
      }

      // 順位制限なし：全員を表示
      globalRankingData.forEach(function(item, index) {
        const rankNum = index + 1;
        let rankBadge = rankNum + '位';
        if (rankNum === 1) rankBadge = '🥇';
        else if (rankNum === 2) rankBadge = '🥈';
        else if (rankNum === 3) rankBadge = '🥉';

        const row = document.createElement('div');
        row.className = "flex justify-between items-center bg-pink-50/50 p-2 rounded-xl border border-pink-100 font-bold";
        row.innerHTML = `
          <div class="flex items-center gap-1.5 overflow-hidden">
            <span class="text-xs shrink-0 font-black text-pink-500 w-6 text-center">${rankBadge}</span>
            <span class="truncate text-gray-700">${item.name}</span>
          </div>
          <div class="shrink-0 text-pink-600 font-black text-right">
            ${item.score} <span class="text-[9px] font-normal">pt</span>
          </div>
        `;
        listElem.appendChild(row);
      });
    }

    window.resetQuiz = function() {
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      document.getElementById('score-bar').style.width = '0%';
      document.getElementById('current-score-text').innerText = '0pt / 355pt';
    }

    window.shareResult = function() {
      const title = document.getElementById('result-title').innerText;
      const shareText = "【メロ男診断】\n" + playerName + "さんのメロポイントは… 【" + totalScore + "pt / 355pt】（" + title + "）でした！\n#メロ男診断";
      const tempInput = document.createElement("textarea");
      tempInput.value = shareText;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand("copy");
      document.body.removeChild(tempInput);
      showToast("結果をコピーしました！SNS等でシェアしてね✨");
    }

    function renderEditList() {
      const editList = document.getElementById('edit-list');
      document.getElementById('edit-count').innerText = window.quizData.length;
      editList.innerHTML = '';

      window.quizData.forEach(function(q, qIndex) {
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm space-y-3";

        let optionsHTML = '';
        q.options.forEach(function(opt, oIndex) {
          optionsHTML += '<div class="flex gap-2 items-center">' +
            '<input type="text" value="' + opt.text + '" onchange="updateOptionText(' + qIndex + ', ' + oIndex + ', this.value)" class="flex-1 text-xs p-2 border border-gray-200 rounded-lg focus:outline-none focus:border-pink-400" placeholder="選択肢">' +
            '<div class="flex items-center gap-1 w-24 shrink-0">' +
              '<span class="text-[10px] text-gray-400 font-bold">+</span>' +
              '<input type="number" value="' + opt.score + '" min="0" max="100" onchange="updateOptionScore(' + qIndex + ', ' + oIndex + ', this.value)" class="w-full text-xs p-2 border border-gray-200 rounded-lg text-center font-bold text-pink-600 focus:outline-none focus:border-pink-400">' +
              '<span class="text-[10px] text-gray-400 font-bold">pt</span>' +
            '</div>' +
          '</div>';
        });

        card.innerHTML = '<div class="flex justify-between items-center border-b border-gray-100 pb-2">' +
            '<span class="text-xs font-bold text-pink-600">質問 ' + (qIndex + 1) + '</span>' +
            '<button onclick="deleteQuestion(' + qIndex + ')" class="text-gray-300 hover:text-rose-500 text-xs transition-colors p-1">' +
              '<i class="fa-solid fa-trash-can"></i> 削除' +
            '</button>' +
          '</div>' +
          '<div>' +
            '<label class="block text-[10px] font-bold text-gray-400 mb-1">女性の発言（LINEメッセージ）</label>' +
            '<input type="text" value="' + q.situation + '" onchange="updateQuestionSituation(' + qIndex + ', this.value)" class="w-full text-xs p-2 border border-pink-200 rounded-xl focus:outline-none focus:border-pink-500 font-medium">' +
          '</div>' +
          '<div class="space-y-1.5">' +
            '<label class="block text-[10px] font-bold text-gray-400">返信選択肢と加算メロ度(pt)</label>' +
            optionsHTML +
          '</div>';

        editList.appendChild(card);
      });
    }

    window.updateQuestionSituation = function(qIndex, val) {
      window.quizData[qIndex].situation = val;
    }

    window.updateOptionText = function(qIndex, oIndex, val) {
      window.quizData[qIndex].options[oIndex].text = val;
    }

    window.updateOptionScore = function(qIndex, oIndex, val) {
      window.quizData[qIndex].options[oIndex].score = parseInt(val, 10) || 0;
    }

    window.addNewQuestionPrompt = function() {
      window.quizData.push({
        situation: "新しいメッセージ内容を入力してください",
        options: [
          { text: "最高の胸キュン返答", score: 25 },
          { text: "まあまあな返答", score: 15 },
          { text: "普通の返答", score: 5 },
          { text: "残念な返答", score: 0 }
        ]
      });
      renderEditList();
      showToast("新しい質問を追加しました！");
    }

    window.deleteQuestion = function(index) {
      if (window.quizData.length <= 1) {
        showToast("質問は最低1件必要です！");
        return;
      }
      window.quizData.splice(index, 1);
      renderEditList();
    }

    window.saveQuizDataToCloud = function() {
      try {
        localStorage.setItem('melo_quiz_saved_data', JSON.stringify(window.quizData));
        showToast("質問データを保存しました！✨");
      } catch(e) {
        showToast("保存に失敗しました");
      }
    }

    function loadSavedQuizData() {
      try {
        const saved = localStorage.getItem('melo_quiz_saved_data');
        if (saved) {
          window.quizData = JSON.parse(saved);
        }
      } catch(e) {}
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50 animate-pop';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2500);
    }

    window.onload = function() {
      loadSavedQuizData();
      initAuth();
    };
  </script>
</body>
</html>
