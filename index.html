<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メロ男診断 & クイズメーカー</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #fbcfe8 100%);
      min-height: 100vh;
    }
    
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.7) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) scale(1.2) rotate(20deg);
        opacity: 0;
      }
    }

    .floating-heart {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.2s ease-out forwards;
      z-index: 50;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.95) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-pop {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: #f472b6;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex items-center justify-center p-2 sm:p-4 min-h-screen text-slate-800">

  <!-- メインコンテナ -->
  <div id="app" class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden border border-white/60 flex flex-col h-[700px] relative">
    
    <!-- PIN入力モーダル (暗証番号保護) -->
    <div id="pin-modal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-pop">
      <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl border border-pink-100 text-center space-y-4 relative">
        <button onclick="closePinModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        
        <div class="w-12 h-12 bg-pink-100 text-pink-600 rounded-2xl flex items-center justify-center mx-auto text-xl shadow-inner">
          <i class="fa-solid fa-lock"></i>
        </div>
        
        <div>
          <h3 class="font-black text-slate-800 text-base">編集者認証</h3>
          <p class="text-xs text-slate-400 mt-1">8桁の暗証番号を入力してください</p>
        </div>

        <input type="password" id="pin-input" maxlength="8" placeholder="••••••••" pattern="[0-9]*" inputmode="numeric" class="w-full text-center text-xl font-black tracking-[0.3em] py-2.5 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 text-pink-600 bg-pink-50/50">

        <div class="flex gap-2 pt-1">
          <button onclick="closePinModal()" class="w-1/2 py-2.5 bg-gray-100 text-gray-600 font-bold rounded-xl text-xs hover:bg-gray-200 transition-all">
            キャンセル
          </button>
          <button onclick="verifyPin()" class="w-1/2 py-2.5 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold rounded-xl text-xs shadow-md hover:opacity-95 active:scale-95 transition-all">
            解除
          </button>
        </div>
      </div>
    </div>

    <!-- 上部ナビゲーション -->
    <div class="bg-white/80 border-b border-pink-100 px-4 py-2 flex justify-between items-center z-30 shrink-0">
      <div class="flex items-center gap-1.5 font-black text-pink-600 text-sm">
        <i class="fa-solid fa-heart-pulse"></i>
        <span>メロ男診断</span>
      </div>
      <div class="flex gap-1 bg-pink-50 p-1 rounded-xl text-xs font-bold">
        <button id="tab-play" onclick="switchMode('play')" class="px-3 py-1.5 rounded-lg bg-pink-500 text-white shadow-sm transition-all">
          <i class="fa-solid fa-gamepad mr-1"></i>プレイ
        </button>
        <button id="tab-edit" onclick="switchMode('edit')" class="px-3 py-1.5 rounded-lg text-gray-500 hover:text-pink-600 transition-all">
          <i class="fa-solid fa-pen-to-square mr-1"></i>クイズ編集
        </button>
      </div>
    </div>

    <!-- 1. プレイモード -->
    <div id="mode-play" class="flex-1 flex flex-col overflow-hidden relative">
      <!-- スタート画面 -->
      <div id="start-screen" class="flex-1 flex flex-col justify-between p-6 text-center z-10 overflow-y-auto">
        <div class="my-auto space-y-6 py-4">
          <div class="relative inline-block">
            <span class="inline-block bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full mb-2 animate-bounce">
              💖 女子をキュンとさせろ！
            </span>
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 tracking-tight">
              メロ男診断
            </h1>
            <p class="text-xs text-pink-400 font-bold mt-1">〜返答1つでメロ度が急上昇〜</p>
          </div>

          <div class="relative w-28 h-28 mx-auto">
            <div class="absolute inset-0 bg-pink-300 rounded-full blur-xl opacity-50 animate-pulse"></div>
            <div class="relative w-full h-full rounded-full bg-gradient-to-tr from-pink-400 to-purple-400 flex items-center justify-center shadow-lg border-4 border-white text-4xl">
              🕺✨
            </div>
          </div>

          <p class="text-gray-600 text-xs leading-relaxed px-4">
            女の子からのあざといLINEにどう返す？<br>
            最高の返答を選んでメロ度100%を目指そう！
          </p>
        </div>

        <div class="space-y-2 shrink-0">
          <button onclick="startQuiz()" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold rounded-2xl shadow-lg shadow-pink-500/30 transform active:scale-95 transition-all text-base flex items-center justify-center gap-2">
            <span>診断スタート</span>
            <i class="fa-solid fa-circle-play"></i>
          </button>
        </div>
      </div>

      <!-- クイズ画面 -->
      <div id="quiz-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <div class="bg-white/90 border-b border-pink-100 p-3 shadow-sm z-20 shrink-0">
          <div class="flex justify-between items-center mb-1.5">
            <span id="question-progress" class="text-[11px] font-bold text-pink-600 bg-pink-50 px-2.5 py-0.5 rounded-full">
              Q 1/4
            </span>
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-fire text-pink-500 text-xs"></i>
              <span class="text-xs text-gray-400 font-bold">現在のメロ度:</span>
              <span id="current-score-text" class="text-base font-black text-pink-600">0%</span>
            </div>
          </div>
          <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden border border-pink-100">
            <div id="score-bar" class="bg-gradient-to-r from-pink-400 to-purple-500 h-full transition-all duration-500 w-0"></div>
          </div>
        </div>

        <div id="chat-area" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50">
          <div class="flex gap-2.5 items-start animate-pop">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-pink-400 to-rose-300 shrink-0 flex items-center justify-center text-white font-bold shadow-sm text-base border-2 border-white">
              👩🏻
            </div>
            <div class="flex flex-col items-start max-w-[80%]">
              <span class="text-[10px] text-gray-400 mb-0.5 ml-1 font-bold">彼女</span>
              <div id="girl-message" class="bg-white border border-pink-100 text-gray-800 text-xs sm:text-sm font-medium p-3 rounded-2xl rounded-tl-none shadow-sm leading-relaxed"></div>
            </div>
          </div>

          <div id="user-reply-container" class="hidden flex gap-2.5 items-start justify-end animate-pop">
            <div class="flex flex-col items-end max-w-[85%]">
              <span class="text-[10px] text-gray-400 mb-0.5 mr-1 font-bold">あなた</span>
              <div id="user-reply-text" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white text-xs sm:text-sm font-medium p-3 rounded-2xl rounded-tr-none shadow-sm leading-relaxed"></div>
              <div id="reply-feedback" class="text-[11px] font-bold mt-1 px-2 py-0.5 rounded-full"></div>
            </div>
          </div>
        </div>

        <div id="options-container" class="p-3 bg-white border-t border-pink-100 space-y-2 shrink-0">
          <p class="text-[11px] text-gray-400 font-bold mb-1 flex items-center gap-1">
            <i class="fa-regular fa-comment"></i> 返事を選択してください：
          </p>
          <div id="options-list" class="space-y-1.5 max-h-[180px] overflow-y-auto"></div>
        </div>

        <div id="next-button-container" class="hidden p-3 bg-white border-t border-pink-100 shrink-0">
          <button id="next-btn" onclick="nextQuestion()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-sm rounded-xl shadow-md hover:opacity-95 active:scale-98 transition-all flex items-center justify-center gap-2">
            <span>次のメッセージを読む</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- 結果画面 -->
      <div id="result-screen" class="hidden flex-1 flex flex-col justify-between p-6 text-center z-10 overflow-y-auto">
        <div class="space-y-4 my-auto">
          <span class="inline-block bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full">
            ✨ 診断完了 ✨
          </span>

          <div>
            <p class="text-xs font-bold text-gray-400">最終メロ度</p>
            <div class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 my-1">
              <span id="final-score">0</span>%
            </div>
          </div>

          <div class="bg-gradient-to-r from-pink-500 to-purple-600 p-0.5 rounded-2xl shadow-md">
            <div class="bg-white rounded-[14px] p-3.5">
              <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">獲得称号</span>
              <h2 id="result-title" class="text-xl font-black text-pink-600 mt-0.5">国宝級メロ男</h2>
            </div>
          </div>

          <div class="bg-white/80 border border-pink-100 rounded-xl p-3.5 text-left shadow-sm">
            <p id="result-description" class="text-xs text-gray-600 leading-relaxed"></p>
          </div>
        </div>

        <div class="space-y-2 pt-3 border-t border-pink-100 shrink-0">
          <button onclick="shareResult()" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold rounded-xl shadow-md text-xs flex items-center justify-center gap-2 transform active:scale-95 transition-all">
            <i class="fa-solid fa-share-nodes"></i>
            <span>結果をコピーしてシェア</span>
          </button>
          <button onclick="resetQuiz()" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl transition-all text-xs flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-rotate-left"></i>
            <span>もう一度遊ぶ</span>
          </button>
        </div>
      </div>

    </div>

    <!-- 2. 編集モード -->
    <div id="mode-edit" class="hidden flex-1 flex flex-col overflow-hidden bg-slate-50">
      <div id="owner-banner" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-2.5 px-4 text-xs flex justify-between items-center shadow-md">
        <div class="flex items-center gap-1.5 font-bold">
          <i class="fa-solid fa-shield-halved text-yellow-300"></i>
          <span>クイズ編集モード</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="lockEditMode()" class="bg-white/20 hover:bg-white/30 text-white font-bold px-2.5 py-1 rounded-lg text-xs transition-all flex items-center gap-1">
            <i class="fa-solid fa-lock"></i> 施錠
          </button>
          <button id="save-btn" onclick="saveQuizDataToCloud()" class="bg-white text-pink-600 hover:bg-pink-50 font-bold px-3 py-1 rounded-lg text-xs shadow transition-all flex items-center gap-1">
            <i class="fa-solid fa-floppy-disk"></i> 保存する
          </button>
        </div>
      </div>

      <div class="p-3 bg-white border-b border-pink-100 flex justify-between items-center shrink-0">
        <span class="text-xs font-bold text-gray-700">登録済み質問 (<span id="edit-count">0</span>件)</span>
        <button id="add-q-btn" onclick="addNewQuestionPrompt()" class="px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-white text-xs font-bold rounded-lg shadow-sm transition-all flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> 新規質問を追加
        </button>
      </div>

      <div id="edit-list" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
    </div>

  </div>

  <script>
    // 初期クイズデータ
    window.quizData = [
      {
        situation: "「今日、すっごく楽しかったな〜！もっと一緒にいたかったかも…」",
        options: [
          { text: "俺も…正直、今日はまだ返したくないな", score: 25 },
          { text: "じゃあ次どこ行く？来週開けておいて！", score: 15 },
          { text: "俺も楽しかった！また遊ぼうね！", score: 5 },
          { text: "終電あるから気をつけて帰ってね！", score: 0 }
        ]
      },
      {
        situation: "「なんか今日、ちょっと手がつめたいかも…（ちらっ）」",
        options: [
          { text: "手、繋いとく？これならあったかいでしょ", score: 25 },
          { text: "上着貸そうか？ちょっと大きいと思うけど", score: 15 },
          { text: "自販機で温かいお茶買ってあげるよ！", score: 5 },
          { text: "天気予報見なかったの？防寒しなきゃダメだよ", score: 0 }
        ]
      },
      {
        situation: "「ねぇ…〇〇くんって、他の女の子にもこんな風に優しいの？」",
        options: [
          { text: "〇〇ちゃんだから特別なんだけど…気づいてなかった？", score: 25 },
          { text: "うーん、どうだろう？内緒（笑）", score: 15 },
          { text: "誰にでも優しくするのは普通でしょ！", score: 5 },
          { text: "特に何も意識してないけど変かな？", score: 0 }
        ]
      },
      {
        situation: "「前髪ちょっと切ったんだけど、気づいた…？（じっと見つめてくる）」",
        options: [
          { text: "もちろん！似合っててめちゃくちゃ可愛いよ", score: 25 },
          { text: "雰囲気変わったと思った！大人っぽくなったね", score: 15 },
          { text: "え！ごめん気づかなかった！", score: 0 },
          { text: "前の方が好きだったかも〜（笑）", score: 0 }
        ]
      }
    ];

    let currentQuestionIndex = 0;
    let totalScore = 0;
    let isUnlocked = false;
    const PIN_CODE = "01170715";

    function switchMode(mode) {
      const playMode = document.getElementById('mode-play');
      const editMode = document.getElementById('mode-edit');
      const tabPlay = document.getElementById('tab-play');
      const tabEdit = document.getElementById('tab-edit');

      if (mode === 'play') {
        playMode.classList.remove('hidden');
        editMode.classList.add('hidden');
        tabPlay.className = "px-3 py-1.5 rounded-lg bg-pink-500 text-white shadow-sm transition-all";
        tabEdit.className = "px-3 py-1.5 rounded-lg text-gray-500 hover:text-pink-600 transition-all";
        resetQuiz();
      } else {
        if (!isUnlocked) {
          openPinModal();
          return;
        }
        playMode.classList.add('hidden');
        editMode.classList.remove('hidden');
        tabEdit.className = "px-3 py-1.5 rounded-lg bg-pink-500 text-white shadow-sm transition-all";
        tabPlay.className = "px-3 py-1.5 rounded-lg text-gray-500 hover:text-pink-600 transition-all";
        renderEditList();
      }
    }

    function openPinModal() {
      const modal = document.getElementById('pin-modal');
      const pinInput = document.getElementById('pin-input');
      pinInput.value = '';
      modal.classList.remove('hidden');
      setTimeout(() => pinInput.focus(), 100);

      pinInput.onkeyup = function(e) {
        if (e.key === 'Enter') verifyPin();
      };
    }

    function closePinModal() {
      document.getElementById('pin-modal').classList.add('hidden');
    }

    function verifyPin() {
      const pinInput = document.getElementById('pin-input');
      if (pinInput.value === PIN_CODE) {
        isUnlocked = true;
        closePinModal();
        showToast("ロックを解除しました 🔓");
        switchMode('edit');
      } else {
        showToast("暗証番号が正しくありません ❌");
        pinInput.value = '';
        pinInput.focus();
      }
    }

    function lockEditMode() {
      isUnlocked = false;
      showToast("編集モードをロックしました 🔒");
      switchMode('play');
    }

    function startQuiz() {
      if (!window.quizData || window.quizData.length === 0) {
        showToast("質問が登録されていません。「クイズ編集」から追加してください！");
        return;
      }
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      currentQuestionIndex = 0;
      totalScore = 0;
      loadQuestion();
    }

    function loadQuestion() {
      const q = window.quizData[currentQuestionIndex];
      
      document.getElementById('question-progress').innerText = "Q " + (currentQuestionIndex + 1) + "/" + window.quizData.length;
      document.getElementById('girl-message').innerText = q.situation;
      
      document.getElementById('user-reply-container').classList.add('hidden');
      document.getElementById('next-button-container').classList.add('hidden');
      document.getElementById('options-container').classList.remove('hidden');

      const optionsList = document.getElementById('options-list');
      optionsList.innerHTML = '';

      q.options.forEach(function(opt) {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-2.5 bg-gray-50 hover:bg-pink-50 border border-gray-200 hover:border-pink-300 rounded-xl text-xs sm:text-sm text-gray-700 font-medium transition-all transform active:scale-98 flex items-center justify-between group";
        btn.innerHTML = '<span>' + opt.text + '</span><i class="fa-solid fa-chevron-right text-[10px] text-gray-300 group-hover:text-pink-400"></i>';
        btn.onclick = function() { selectOption(opt); };
        optionsList.appendChild(btn);
      });
    }

    function selectOption(option) {
      totalScore += option.score;
      if (totalScore > 100) totalScore = 100;

      document.getElementById('score-bar').style.width = totalScore + '%';
      document.getElementById('current-score-text').innerText = totalScore + '%';

      document.getElementById('options-container').classList.add('hidden');
      
      const replyContainer = document.getElementById('user-reply-container');
      const replyText = document.getElementById('user-reply-text');
      const feedbackText = document.getElementById('reply-feedback');

      replyText.innerText = option.text;
      
      if (option.score >= 20) {
        feedbackText.className = "text-[11px] font-bold mt-1 px-2 py-0.5 rounded-full bg-pink-100 text-pink-600";
        feedbackText.innerText = "[メロ度 +" + option.score + "%] 最高の一言！女子はメロメロ✨";
        createHearts();
      } else if (option.score > 0) {
        feedbackText.className = "text-[11px] font-bold mt-1 px-2 py-0.5 rounded-full bg-purple-100 text-purple-600";
        feedbackText.innerText = "[メロ度 +" + option.score + "%] 悪くない返事！好感度アップ";
      } else {
        feedbackText.className = "text-[11px] font-bold mt-1 px-2 py-0.5 rounded-full bg-gray-100 text-gray-500";
        feedbackText.innerText = "[メロ度 +0%] メロ要素なし！不器用な返事";
      }

      replyContainer.classList.remove('hidden');
      document.getElementById('next-button-container').classList.remove('hidden');
    }

    function createHearts() {
      const container = document.getElementById('quiz-screen');
      for (let i = 0; i < 5; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart text-pink-500 text-lg';
        heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
        heart.style.left = (Math.random() * 80 + 10) + '%';
        heart.style.bottom = '90px';
        heart.style.animationDelay = (Math.random() * 0.2) + 's';
        container.appendChild(heart);
        setTimeout(function() { heart.remove(); }, 1300);
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < window.quizData.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      const scoreElem = document.getElementById('final-score');
      const titleElem = document.getElementById('result-title');
      const descElem = document.getElementById('result-description');

      let currentDisplayScore = 0;
      const timer = setInterval(function() {
        if (currentDisplayScore >= totalScore) {
          scoreElem.innerText = totalScore;
          clearInterval(timer);
        } else {
          currentDisplayScore++;
          scoreElem.innerText = currentDisplayScore;
        }
      }, 15);

      if (totalScore >= 80) {
        titleElem.innerText = "👑 限界メロ男";
        descElem.innerText = "すべての言葉が女子のツボを突きまくる完璧なメロ男！一緒に入るだけで周りを胸キュンで包み込む罪な存在です。";
      } else if (totalScore >= 50) {
        titleElem.innerText = "✨ 隠れメロ男";
        descElem.innerText = "さりげない優しさとセンスのある返しができるタイプ！ふとした瞬間の甘い一言に女子はギャップ萌えしています。";
      } else if (totalScore >= 20) {
        titleElem.innerText = "🌱 ピュアな普通男";
        descElem.innerText = "誠実だけどちょっぴりシャイ。もう少し甘い言葉や「特別感」を伝える工夫をすると一気にメロ度がアップします！";
      } else {
        titleElem.innerText = "🗿 鋼鉄のストイック男";
        descElem.innerText = "正論・現実的な返しが得意なストイックタイプ！メロ度は低めですが、嘘のない信頼感で勝負するタイプです。";
      }
    }

    function resetQuiz() {
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      document.getElementById('score-bar').style.width = '0%';
      document.getElementById('current-score-text').innerText = '0%';
    }

    function shareResult() {
      const title = document.getElementById('result-title').innerText;
      const shareText = "【メロ男診断】\n私のメロ度は… 【" + totalScore + "%】（称号: " + title + "）でした！\n#メロ男診断";
      const tempInput = document.createElement("textarea");
      tempInput.value = shareText;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand("copy");
      document.body.removeChild(tempInput);
      showToast("結果をコピーしました！SNS等でシェアしてね✨");
    }

    function renderEditList() {
      const editList = document.getElementById('edit-list');
      document.getElementById('edit-count').innerText = window.quizData.length;
      editList.innerHTML = '';

      window.quizData.forEach(function(q, qIndex) {
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm space-y-3";

        let optionsHTML = '';
        q.options.forEach(function(opt, oIndex) {
          optionsHTML += '<div class="flex gap-2 items-center">' +
            '<input type="text" value="' + opt.text + '" onchange="updateOptionText(' + qIndex + ', ' + oIndex + ', this.value)" class="flex-1 text-xs p-2 border border-gray-200 rounded-lg focus:outline-none focus:border-pink-400" placeholder="選択肢">' +
            '<div class="flex items-center gap-1 w-24 shrink-0">' +
              '<span class="text-[10px] text-gray-400 font-bold">+</span>' +
              '<input type="number" value="' + opt.score + '" min="0" max="100" onchange="updateOptionScore(' + qIndex + ', ' + oIndex + ', this.value)" class="w-full text-xs p-2 border border-gray-200 rounded-lg text-center font-bold text-pink-600 focus:outline-none focus:border-pink-400">' +
              '<span class="text-[10px] text-gray-400 font-bold">pt</span>' +
            '</div>' +
          '</div>';
        });

        card.innerHTML = '<div class="flex justify-between items-center border-b border-gray-100 pb-2">' +
            '<span class="text-xs font-bold text-pink-600">質問 ' + (qIndex + 1) + '</span>' +
            '<button onclick="deleteQuestion(' + qIndex + ')" class="text-gray-300 hover:text-rose-500 text-xs transition-colors p-1">' +
              '<i class="fa-solid fa-trash-can"></i> 削除' +
            '</button>' +
          '</div>' +
          '<div>' +
            '<label class="block text-[10px] font-bold text-gray-400 mb-1">女性の発言（LINEメッセージ）</label>' +
            '<input type="text" value="' + q.situation + '" onchange="updateQuestionSituation(' + qIndex + ', this.value)" class="w-full text-xs p-2 border border-pink-200 rounded-xl focus:outline-none focus:border-pink-500 font-medium">' +
          '</div>' +
          '<div class="space-y-1.5">' +
            '<label class="block text-[10px] font-bold text-gray-400">返信選択肢と加算メロ度(pt)</label>' +
            optionsHTML +
          '</div>';

        editList.appendChild(card);
      });
    }

    function updateQuestionSituation(qIndex, val) {
      window.quizData[qIndex].situation = val;
    }

    function updateOptionText(qIndex, oIndex, val) {
      window.quizData[qIndex].options[oIndex].text = val;
    }

    function updateOptionScore(qIndex, oIndex, val) {
      window.quizData[qIndex].options[oIndex].score = parseInt(val, 10) || 0;
    }

    function addNewQuestionPrompt() {
      window.quizData.push({
        situation: "新しいメッセージ内容を入力してください",
        options: [
          { text: "最高の胸キュン返答", score: 25 },
          { text: "まあまあな返答", score: 15 },
          { text: "普通の返答", score: 5 },
          { text: "残念な返答", score: 0 }
        ]
      });
      renderEditList();
      showToast("新しい質問を追加しました！");
    }

    function deleteQuestion(index) {
      if (window.quizData.length <= 1) {
        showToast("質問は最低1件必要です！");
        return;
      }
      window.quizData.splice(index, 1);
      renderEditList();
    }

    function saveQuizDataToCloud() {
      try {
        localStorage.setItem('melo_quiz_saved_data', JSON.stringify(window.quizData));
        showToast("質問データを保存しました！✨");
      } catch(e) {
        showToast("保存に失敗しました");
      }
    }

    function loadSavedQuizData() {
      try {
        const saved = localStorage.getItem('melo_quiz_saved_data');
        if (saved) {
          window.quizData = JSON.parse(saved);
        }
      } catch(e) {}
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50 animate-pop';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2500);
    }

    window.onload = function() {
      loadSavedQuizData();
    };
  </script>
</body>
</html>
